<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ascii_tube in the browser: play a video as ASCII art on an emulated CRT terminal. Runs entirely on your device; nothing is uploaded.">
<title>ascii_tube — CRT</title>
<style>
  :root { --bezel: #161310; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #000; overflow: hidden;
    font-family: "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, monospace;
    cursor: default;
  }
  /* Ambient room glow behind the tube */
  #stage {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: radial-gradient(ellipse at center, #0a0d0a 0%, #000 70%);
    padding-bottom: 34px;
  }
  /* The physical set: bezel + tube */
  #set {
    position: relative; width: min(96vw, calc((100vh - 44px) * 4 / 3)); aspect-ratio: 4 / 3;
    border-radius: 3.2% / 4.3%;
    background: linear-gradient(155deg, #2a2620, #100e0b 60%, #050403);
    padding: 2.6%;
    box-shadow:
      inset 0 0 4px 2px rgba(255,255,255,.06),
      inset 0 0 40px 10px rgba(0,0,0,.85),
      0 30px 80px -20px rgba(0,0,0,.9),
      0 0 120px -10px rgba(120,180,90,.12);
  }
  #crt {
    display: block; width: 100%; height: 100%;
    border-radius: 2% / 2.6%;
    background: #000;
    image-rendering: pixelated; image-rendering: optimizeSpeed;
  }
  /* Soft outer glass reflection */
  #set::after {
    content: ""; position: absolute; inset: 2.6%;
    border-radius: 2% / 2.6%; pointer-events: none;
    background: linear-gradient(150deg, rgba(255,255,255,.07), rgba(255,255,255,0) 22%, rgba(255,255,255,0) 78%, rgba(255,255,255,.03));
    mix-blend-mode: screen;
  }
  #power {
    position: absolute; inset: 2.6%; display: grid; place-items: center;
    color: #6f8f5a; letter-spacing: .25em; text-align: center;
    background: #000; border-radius: 2% / 2.6%;
    cursor: pointer; z-index: 5; user-select: none;
    padding: 0 6%;
  }
  #power .blink { animation: blink 1.2s steps(2,end) infinite; font-size: clamp(14px, 2.4vw, 22px); }
  @keyframes blink { 50% { opacity: .15; } }
  #power small { display:block; margin-top: 1.2em; font-size: clamp(9px, 1.2vw, 12px); color:#4f6a40; letter-spacing:.18em; line-height: 1.7; }
  #power small b { color: #8fb873; font-weight: normal; }
  #hint {
    position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 10px;
    width: max-content; max-width: calc(100vw - 32px);
    color: #3c5430; font-size: 11px; letter-spacing: .15em; z-index: 6;
  }
  #hint button {
    font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0;
    padding: 4px 2px; cursor: pointer; opacity: .75;
  }
  #hint button:hover, #hint button:focus-visible { color: #8fb873; opacity: 1; outline: none; }
  #hint .note { opacity: .6; padding: 4px 2px; }
</style>
</head>
<body>
  <div id="stage">
    <div id="set">
      <canvas id="crt" width="1280" height="960" aria-label="ASCII video terminal"></canvas>
      <div id="power" role="button" tabindex="0">
        <div>
          <div class="blink">▶ POWER ON</div>
          <small>ascii_tube &nbsp;·&nbsp; click to start the tube<br>
            <b>runs entirely in your browser — your video is never uploaded</b></small>
        </div>
      </div>
    </div>
  </div>
  <nav id="hint" aria-label="controls">
    <button data-key="o">[O]pen</button>
    <button data-key=" ">[Space] pause</button>
    <button data-key="ArrowLeft">[←]</button><button data-key="ArrowRight">[→] seek</button>
    <button data-key="c">[C]olour</button>
    <button data-key="d">[D]ither</button>
    <button data-key="m">[M]ono</button>
    <button data-key="?">[?] help</button>
    <span class="note">· or drop a video · stays on your device</span>
  </nav>
  <script type="module" src="js/main.js"></script>
</body>
</html>
